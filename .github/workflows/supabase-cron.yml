name: Supabase cron

on:
  schedule:
    # Keep-alive: every 3 days at 06:00 UTC (free-tier projects pause after 7 idle days)
    - cron: '0 6 */3 * *'
    # Daily study reminder: 09:00 JST (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set"; exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/user_progress?select=user_id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $code"
          [ "$code" = "200" ] || exit 1

  daily-reminder:
    # Only on the daily schedule (or manual runs), not on the keep-alive schedule
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Send push reminder to all subscribers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PUSH_ADMIN_SECRET: ${{ secrets.PUSH_ADMIN_SECRET }}
        run: |
          if [ -z "$PUSH_ADMIN_SECRET" ]; then
            echo "PUSH_ADMIN_SECRET not set — skipping reminder"; exit 0
          fi
          resp=$(curl -s -w '\n%{http_code}' -X POST "$SUPABASE_URL/functions/v1/push-send" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "X-Admin-Secret: $PUSH_ADMIN_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"user_id":"all","title":"JPN2easy — today\u0027s N2 session","body":"Daily 10 drills, SRS cards and one grammar point are waiting. Keep the streak!","url":"/#dashboard","tag":"study-reminder"}')
          echo "$resp"
          code=$(echo "$resp" | tail -n1)
          [ "$code" = "200" ] || exit 1
